<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Acesso Bloqueado - Guardião Anti-Apostas</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 500px;
            border: 2px solid #334155;
        }
        h1 { color: #f43f5e; margin-bottom: 20px; font-size: 28px; }
        p { color: #94a3b8; font-size: 16px; line-height: 1.6; margin-bottom: 30px; }
        .btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #059669; }
    </style>
</head>
<body>
    <div class="card">
        <h1>⛔ Acesso Bloqueado</h1>
        <p>Você deu um passo importante para proteger o seu futuro, o seu dinheiro e a sua tranquilidade. Respira fundo. O vício tenta nos vencer pelo impulso, mas você é mais forte do que isso.</p>
        <p><i>"A persistência é o caminho para o êxito."</i></p>
        <a href="https://www.google.com" class="btn">Voltar à Segurança</a>
    </div>
</body>
</html>
